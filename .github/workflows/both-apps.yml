name: Both apps together

# The two real apps against each other: the iPhone app in the iOS Simulator and the Samsung
# app in an Android emulator, on one Mac. It needs GitHub's Intel Mac (its Apple-chip Macs
# cannot run an Android emulator), which gives the emulator a single slow processor core, so
# a run can take two hours and can fail just because Android was too slow to answer. It
# therefore runs only when asked for: with "Run workflow" on the Actions page, or by a push
# whose commit message contains [both-apps].
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  both-apps:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[both-apps]')
    runs-on: macos-15-intel
    timeout-minutes: 150
    permissions:
      contents: write # publishes logs and screenshots to the ci-results-both branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the Samsung app
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Prepare an Android emulator
        # This Mac gives the emulator a single processor core, so it gets the lightest Android
        # the app supports (8.0) and none of the simulated hardware the app does not use.
        # tools/android-check.sh covers the newer Android versions, on faster machines.
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin"
          IMAGE="system-images;android-26;default;x86_64"
          yes | "$SDK/sdkmanager" --install emulator platform-tools "$IMAGE" > /dev/null || true
          echo no | "$SDK/avdmanager" create avd -n contactsync -k "$IMAGE" -d pixel_6 --force
          CONFIG="$HOME/.android/avd/contactsync.avd/config.ini"
          for setting in hw.accelerometer=no hw.gyroscope=no hw.sensors.proximity=no hw.sensors.light=no \
              hw.sensors.pressure=no hw.sensors.humidity=no hw.sensors.magnetic_field=no \
              hw.sensors.orientation=no hw.sensors.temperature=no hw.gps=no hw.audioInput=no \
              hw.audioOutput=no hw.camera.back=none hw.camera.front=none; do
            grep -v "^${setting%%=*} *=" "$CONFIG" > "$CONFIG.new" || true
            mv "$CONFIG.new" "$CONFIG"
            echo "$setting" >> "$CONFIG"
          done
      - name: Run both apps against each other
        id: both
        env:
          ANDROID_AVD: contactsync
          BULK: "300"
        run: |
          brew install xcodegen
          ios/both-apps-check.sh
      - name: Publish results to the ci-results-both branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results
          cd results
          {
            echo "# Both real apps, for ${GITHUB_SHA}"
            echo
            echo "- Result: ${{ steps.both.outcome }}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```'
            cat ../ios/ContactSyncSender/both-results/summary.txt 2> /dev/null
            echo '```'
          } > README.md
          cp -R ../ios/ContactSyncSender/both-results . 2> /dev/null || true
          git init -q -b ci-results-both
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Both real apps, for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results-both
