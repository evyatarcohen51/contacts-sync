name: Build apps

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    permissions:
      contents: write # publishes logs, screenshots and the .ipa to the ci-results branch
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        working-directory: ios/ContactSyncSender
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate
      - name: Build for iPhone (unsigned)
        id: build
        working-directory: ios/ContactSyncSender
        run: |
          if ! xcodebuild -project ContactSyncSender.xcodeproj -target ContactSyncSender \
              -configuration Release -sdk iphoneos \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              SYMROOT="$PWD/build" build > build.log 2>&1; then
            echo "Build failed. Errors:"
            grep -nE "error:|fatal error" build.log || tail -n 80 build.log
            exit 1
          fi
          grep -E "warning:" build.log | sort -u | head -n 40 || true
          tail -n 3 build.log
      - name: Package .ipa
        id: package
        working-directory: ios/ContactSyncSender
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/ContactSyncSender.app Payload/
          zip -qry ContactSyncSender-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ContactSyncSender-ios-unsigned
          path: ios/ContactSyncSender/ContactSyncSender-unsigned.ipa
      - name: Run in the iOS Simulator
        id: simulator
        if: always() && steps.build.outcome != 'skipped'
        run: ios/simulator-check.sh
      - name: Publish results to the ci-results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results
          cd results
          {
            echo "# Results for ${GITHUB_SHA}"
            echo
            echo "- iPhone build: ${{ steps.build.outcome }}"
            echo "- .ipa: ${{ steps.package.outcome }}"
            echo "- Simulator run: ${{ steps.simulator.outcome }}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > README.md
          cp ../ios/ContactSyncSender/build.log . 2>/dev/null || true
          grep -nE "error:|fatal error" build.log > build-errors.txt 2>/dev/null || true
          cp ../ios/ContactSyncSender/ContactSyncSender-unsigned.ipa . 2>/dev/null || true
          cp -R ../ios/ContactSyncSender/sim-results . 2>/dev/null || true
          git init -q -b ci-results
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Results for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-logs-and-screenshots
          path: |
            ios/ContactSyncSender/build.log
            ios/ContactSyncSender/sim-results

  # The two real apps against each other: the iPhone app in the iOS Simulator and the Samsung
  # app in an Android emulator, on one Mac. Needs GitHub's Intel Mac: its Apple-chip Macs
  # cannot run an Android emulator.
  both-apps:
    runs-on: macos-15-intel
    timeout-minutes: 150
    permissions:
      contents: write # publishes logs and screenshots to the ci-results-both branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the Samsung app
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Prepare an Android emulator
        # This Mac gives the emulator a single processor core, so it gets the lightest Android
        # the app supports (8.0) and none of the simulated hardware the app does not use.
        # tools/android-check.sh covers the newer Android versions, on faster machines.
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin"
          IMAGE="system-images;android-26;default;x86_64"
          yes | "$SDK/sdkmanager" --install emulator platform-tools "$IMAGE" > /dev/null || true
          echo no | "$SDK/avdmanager" create avd -n contactsync -k "$IMAGE" -d pixel_6 --force
          CONFIG="$HOME/.android/avd/contactsync.avd/config.ini"
          for setting in hw.accelerometer=no hw.gyroscope=no hw.sensors.proximity=no hw.sensors.light=no \
              hw.sensors.pressure=no hw.sensors.humidity=no hw.sensors.magnetic_field=no \
              hw.sensors.orientation=no hw.sensors.temperature=no hw.gps=no hw.audioInput=no \
              hw.audioOutput=no hw.camera.back=none hw.camera.front=none; do
            grep -v "^${setting%%=*} *=" "$CONFIG" > "$CONFIG.new" || true
            mv "$CONFIG.new" "$CONFIG"
            echo "$setting" >> "$CONFIG"
          done
      - name: Run both apps against each other
        id: both
        env:
          ANDROID_AVD: contactsync
          BULK: "300"
        run: |
          brew install xcodegen
          ios/both-apps-check.sh
      - name: Publish results to the ci-results-both branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results
          cd results
          {
            echo "# Both real apps, for ${GITHUB_SHA}"
            echo
            echo "- Result: ${{ steps.both.outcome }}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```'
            cat ../ios/ContactSyncSender/both-results/summary.txt 2> /dev/null
            echo '```'
          } > README.md
          cp -R ../ios/ContactSyncSender/both-results . 2> /dev/null || true
          git init -q -b ci-results-both
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Both real apps, for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results-both

  # The iPhone app's logic (protocol, export, URL handling) compiled and tested on Linux.
  ios-logic:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: ios/linux-check
        run: ./run.sh

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ContactSyncReceiver-android
          path: android/app/build/outputs/apk/release/app-release.apk

  # The Samsung app itself, in Android emulators of the oldest and newest versions it
  # supports, with tools/fake-iphone.js standing in for the iPhone. On Android 14 the
  # iPhone app's own Swift code (ios/linux-check) then pairs and syncs with it too.
  android-device:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [26, 30, 34, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Start an Android emulator (it boots while the app builds)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin"
          IMAGE="system-images;android-${{ matrix.api }};default;x86_64"
          yes | "$SDK/sdkmanager" --install emulator platform-tools "$IMAGE" > /dev/null || true
          echo no | "$SDK/avdmanager" create avd -n contactsync -k "$IMAGE" -d pixel_6 --force
          nohup "$ANDROID_HOME/emulator/emulator" -avd contactsync -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -no-snapshot -no-metrics > emulator.log 2>&1 &
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Build the Samsung app
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Check the Samsung app on Android API ${{ matrix.api }}
        run: tools/android-check.sh android/app/build/outputs/apk/release/app-release.apk
      - name: The iPhone app's Swift code against this Samsung app
        if: matrix.api == 34
        run: |
          curl -sfL https://download.swift.org/swift-6.1.2-release/ubuntu2404/swift-6.1.2-RELEASE/swift-6.1.2-RELEASE-ubuntu24.04.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/swift-6.1.2-RELEASE-ubuntu24.04/usr/bin:$PATH"
          adb shell am start -n com.dvirchi.contactsync.receiver/.MainActivity
          adb forward tcp:18765 tcp:8765
          cd ios/linux-check
          ./run.sh 127.0.0.1:18765 2>&1 | tee "$GITHUB_WORKSPACE/swift-check.log" | grep -E "Test Case|error|Executed|PAIRED" || true
          grep -q "testPairThenSyncLikeTheIPhone' passed" "$GITHUB_WORKSPACE/swift-check.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-${{ matrix.api }}
          path: |
            android/check-results
            emulator.log
            swift-check.log

  # One page with the results of the jobs above, on the ci-results-android branch.
  android-device-results:
    needs: android-device
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: android-check-*
          path: results
      - name: Publish results to the ci-results-android branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd results
          {
            echo "# The Samsung app in Android emulators, for ${GITHUB_SHA}"
            echo
            echo "- Result: ${{ needs.android-device.result }}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            for d in android-check-*; do
              echo
              echo "## Android API ${d#android-check-}"
              echo
              echo '```'
              cat "$d/android/check-results/summary.txt" 2> /dev/null || echo "(no summary)"
              grep -hE "testPairThenSyncLikeTheIPhone|Executed .* tests" "$d/swift-check.log" 2> /dev/null | tail -n 2
              echo '```'
            done
          } > README.md
          git init -q -b ci-results-android
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "The Samsung app in Android emulators, for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results-android
