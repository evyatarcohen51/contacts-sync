name: Build apps

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    permissions:
      contents: write # publishes logs, screenshots and the .ipa to the ci-results branch
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        working-directory: ios/ContactSyncSender
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate
      - name: Build for iPhone (unsigned)
        id: build
        working-directory: ios/ContactSyncSender
        run: |
          if ! xcodebuild -project ContactSyncSender.xcodeproj -target ContactSyncSender \
              -configuration Release -sdk iphoneos \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              SYMROOT="$PWD/build" build > build.log 2>&1; then
            echo "Build failed. Errors:"
            grep -nE "error:|fatal error" build.log || tail -n 80 build.log
            exit 1
          fi
          grep -E "warning:" build.log | sort -u | head -n 40 || true
          tail -n 3 build.log
      - name: Package .ipa
        id: package
        working-directory: ios/ContactSyncSender
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/ContactSyncSender.app Payload/
          zip -qry ContactSyncSender-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ContactSyncSender-ios-unsigned
          path: ios/ContactSyncSender/ContactSyncSender-unsigned.ipa
      - name: Run in the iOS Simulator
        id: simulator
        if: always() && steps.build.outcome != 'skipped'
        run: ios/simulator-check.sh
      - name: Publish results to the ci-results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results
          cd results
          {
            echo "# Results for ${GITHUB_SHA}"
            echo
            echo "- iPhone build: ${{ steps.build.outcome }}"
            echo "- .ipa: ${{ steps.package.outcome }}"
            echo "- Simulator run: ${{ steps.simulator.outcome }}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > README.md
          cp ../ios/ContactSyncSender/build.log . 2>/dev/null || true
          grep -nE "error:|fatal error" build.log > build-errors.txt 2>/dev/null || true
          cp ../ios/ContactSyncSender/ContactSyncSender-unsigned.ipa . 2>/dev/null || true
          cp -R ../ios/ContactSyncSender/sim-results . 2>/dev/null || true
          git init -q -b ci-results
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Results for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-logs-and-screenshots
          path: |
            ios/ContactSyncSender/build.log
            ios/ContactSyncSender/sim-results

  # The two real apps against each other: the iPhone app in the iOS Simulator and the Samsung
  # app in an Android emulator, on one Mac. Needs GitHub's Intel Mac: its Apple-chip Macs
  # cannot run an Android emulator.
  both-apps:
    runs-on: macos-15-intel
    timeout-minutes: 100
    permissions:
      contents: write # publishes logs and screenshots to the ci-results-both branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Start an Android emulator (it boots while the app builds)
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin"
          IMAGE="system-images;android-34;google_apis;x86_64"
          yes | "$SDK/sdkmanager" --install emulator platform-tools "$IMAGE" > /dev/null || true
          echo no | "$SDK/avdmanager" create avd -n contactsync -k "$IMAGE" -d pixel_6 --force
          nohup "$ANDROID_HOME/emulator/emulator" -avd contactsync -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -no-snapshot > emulator.log 2>&1 &
      - name: Build the Samsung app
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Wait for Android to finish starting
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          for i in $(seq 300); do
            [ "$("$ADB" shell getprop sys.boot_completed 2> /dev/null | tr -d '\r')" = 1 ] && break
            sleep 5
          done
          "$ADB" shell getprop ro.build.version.release || { tail -n 40 emulator.log; exit 1; }
      - name: Run both apps against each other
        id: both
        run: |
          brew install xcodegen
          ios/both-apps-check.sh
      - name: Publish results to the ci-results-both branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results
          cd results
          {
            echo "# Both real apps, for ${GITHUB_SHA}"
            echo
            echo "- Result: ${{ steps.both.outcome }}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```'
            cat ../ios/ContactSyncSender/both-results/summary.txt 2> /dev/null
            echo '```'
          } > README.md
          cp -R ../ios/ContactSyncSender/both-results . 2> /dev/null || true
          cp ../emulator.log . 2> /dev/null || true
          git init -q -b ci-results-both
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Both real apps, for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results-both

  # The iPhone app's logic (protocol, export, URL handling) compiled and tested on Linux.
  ios-logic:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: ios/linux-check
        run: ./run.sh

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ContactSyncReceiver-android
          path: android/app/build/outputs/apk/release/app-release.apk
